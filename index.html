<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Macro Tracker (Local Storage)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border-radius: 12px;
      }
      .table th,
      .table td {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Daily Macro Tracker</h2>

      <!-- Input Form -->
      <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">
          <div class="col-md-3">
            <input
              type="text"
              id="food"
              class="form-control"
              placeholder="Food name"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="protein"
              class="form-control"
              placeholder="Protein (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="carbs"
              class="form-control"
              placeholder="Carbs (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="fat"
              class="form-control"
              placeholder="Fat (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="calories"
              class="form-control"
              placeholder="Calories"
            />
          </div>
          <div class="col-md-1 d-grid">
            <button class="btn btn-primary" onclick="addFood()">Add</button>
          </div>
        </div>
      </div>

      <!-- Food Table -->
      <div class="card p-4 shadow-sm">
        <!-- Today's Macros -->
        <div class="card p-4 mb-4 shadow-sm">
          <h5 class="mb-3">Today's Macros</h5>
          <div class="row text-center">
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Protein</div>
              <div id="todayProtein">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Carbs</div>
              <div id="todayCarbs">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Fat</div>
              <div id="todayFat">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Calories</div>
              <div id="todayCalories">0</div>
            </div>
          </div>
        </div>

        <table class="table table-striped text-center">
          <thead class="table-dark">
            <tr>
              <th>Food</th>
              <th>Protein (g)</th>
              <th>Carbs (g)</th>
              <th>Fat (g)</th>
              <th>Calories</th>
            </tr>
          </thead>
          <tbody id="foodTable"></tbody>
          <tfoot class="fw-bold">
            <tr>
              <td>Total</td>
              <td id="totalProtein">0</td>
              <td id="totalCarbs">0</td>
              <td id="totalFat">0</td>
              <td id="totalCalories">0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="text-end mt-3">
        <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        deleteDoc,
        doc
      } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js'
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged
      } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'

      // 🔹 Your Firebase config
      const firebaseConfig = {
        apiKey: 'AIzaSyBNLdpGD9XMxY_5xCxeCvy8szbBXJVj9Zk',
        authDomain: 'macro-tracker-4b15c.firebaseapp.com',
        projectId: 'macro-tracker-4b15c',
        storageBucket: 'macro-tracker-4b15c.firebasestorage.app',
        messagingSenderId: '461230729270',
        appId: '1:461230729270:web:00bed39367c087015b9097'
      }

      // Initialize Firebase
      const app = initializeApp(firebaseConfig)
      const db = getFirestore(app)
      const auth = getAuth(app)

      let userId = null
      let foods = []
      const today = new Date().toISOString().split('T')[0]

      const dailyTargets = {
        calories: 1900,
        protein: 160,
        carbs: 160,
        fat: 65
      }

      signInAnonymously(auth)

      onAuthStateChanged(auth, async user => {
        if (user) {
          userId = user.uid
          await loadTodayMacros()
        }
      })

      async function loadTodayMacros() {
        foods = []
        document.getElementById('foodTable').innerHTML = ''

        const q = query(
          collection(db, 'users', userId, 'macros'),
          where('date', '==', today)
        )

        const snapshot = await getDocs(q)
        snapshot.forEach(docSnap => {
          const data = docSnap.data()
          data.id = docSnap.id // store document id for deletion
          foods.push(data)
          addRow(data)
        })

        updateTotals()
      }

      function addRow(food) {
        const table = document.getElementById('foodTable')
        const tr = document.createElement('tr')
        tr.innerHTML = `
      <td>${food.foodName}</td>
      <td>${food.protein}</td>
      <td>${food.carbs}</td>
      <td>${food.fat}</td>
      <td>${food.calories}</td>
      <td><button onclick="deleteFood('${food.id}')">Delete</button></td>
    `
        table.appendChild(tr)
      }

      function updateTotals() {
        const totals = foods.reduce(
          (acc, f) => {
            acc.protein += f.protein
            acc.carbs += f.carbs
            acc.fat += f.fat
            acc.calories += f.calories
            return acc
          },
          { protein: 0, carbs: 0, fat: 0, calories: 0 }
        )

        document.getElementById(
          'todayProtein'
        ).textContent = `${totals.protein} / ${dailyTargets.protein} g`
        document.getElementById(
          'todayCarbs'
        ).textContent = `${totals.carbs} / ${dailyTargets.carbs} g`
        document.getElementById(
          'todayFat'
        ).textContent = `${totals.fat} / ${dailyTargets.fat} g`
        document.getElementById(
          'todayCalories'
        ).textContent = `${totals.calories} / ${dailyTargets.calories} kcal`
      }

      function clearInputs() {
        document.getElementById('food').value = ''
        document.getElementById('protein').value = ''
        document.getElementById('carbs').value = ''
        document.getElementById('fat').value = ''
        document.getElementById('calories').value = ''
      }

      window.addFood = async function () {
        const foodName = document.getElementById('food').value.trim()
        const protein = Number(document.getElementById('protein').value)
        const carbs = Number(document.getElementById('carbs').value)
        const fat = Number(document.getElementById('fat').value)
        const calories = Number(document.getElementById('calories').value)

        if (!foodName) return alert('Enter food name')

        const food = { foodName, protein, carbs, fat, calories, date: today }

        const docRef = await addDoc(
          collection(db, 'users', userId, 'macros'),
          food
        )

        food.id = docRef.id
        foods.push(food)
        addRow(food)
        updateTotals()
        clearInputs()
      }

      window.deleteFood = async function (id) {
        await deleteDoc(doc(db, 'users', userId, 'macros', id))
        foods = foods.filter(f => f.id !== id)
        document.getElementById('foodTable').innerHTML = ''
        foods.forEach(addRow)
        updateTotals()
      }
    </script>
  </body>
</html>
