<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Macro Tracker (Local Storage)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border-radius: 12px;
      }
      .table th,
      .table td {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Daily Macro Tracker</h2>

      <!-- Input Form -->
      <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">
          <div class="col-md-3">
            <input
              type="text"
              id="food"
              class="form-control"
              placeholder="Food name"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="protein"
              class="form-control"
              placeholder="Protein (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="carbs"
              class="form-control"
              placeholder="Carbs (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="fat"
              class="form-control"
              placeholder="Fat (g)"
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="calories"
              class="form-control"
              placeholder="Calories"
            />
          </div>
          <div class="col-md-1 d-grid">
            <button class="btn btn-primary" onclick="addFood()">Add</button>
          </div>
        </div>
      </div>

      <!-- Food Table -->
      <div class="card p-4 shadow-sm">
        <!-- Today's Macros -->
        <div class="card p-4 mb-4 shadow-sm">
          <h5 class="mb-3">Today's Macros</h5>
          <div class="row text-center">
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Protein</div>
              <div id="todayProtein">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Carbs</div>
              <div id="todayCarbs">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Fat</div>
              <div id="todayFat">0 g</div>
            </div>
            <div class="col-md-3 col-6 mb-2">
              <div class="fw-bold">Calories</div>
              <div id="todayCalories">0</div>
            </div>
          </div>
        </div>

        <table class="table table-striped text-center">
          <thead class="table-dark">
            <tr>
              <th>Food</th>
              <th>Protein (g)</th>
              <th>Carbs (g)</th>
              <th>Fat (g)</th>
              <th>Calories</th>
            </tr>
          </thead>
          <tbody id="foodTable"></tbody>
          <tfoot class="fw-bold">
            <tr>
              <td>Total</td>
              <td id="totalProtein">0</td>
              <td id="totalCarbs">0</td>
              <td id="totalFat">0</td>
              <td id="totalCalories">0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="text-end mt-3">
        <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <script>
      let foods = JSON.parse(localStorage.getItem("foods")) || [];

      function saveToLocalStorage() {
        localStorage.setItem("foods", JSON.stringify(foods));
      }

      function loadFoods() {
        foods.forEach((food) => addRow(food));
        updateTotals();
      }

      function addFood() {
        const foodName = document.getElementById("food").value.trim();
        const protein = Number(document.getElementById("protein").value);
        const carbs = Number(document.getElementById("carbs").value);
        const fat = Number(document.getElementById("fat").value);
        const calories = Number(document.getElementById("calories").value);

        if (!foodName || protein < 0 || carbs < 0 || fat < 0 || calories < 0) {
          alert("Please enter valid values.");
          return;
        }

        const food = { foodName, protein, carbs, fat, calories };
        foods.push(food);

        saveToLocalStorage();
        addRow(food);
        updateTotals();
        clearInputs();
      }

      function addRow(food) {
        const table = document.getElementById("foodTable");
        const row = table.insertRow();

        row.innerHTML = `
      <td>${food.foodName}</td>
      <td>${food.protein}</td>
      <td>${food.carbs}</td>
      <td>${food.fat}</td>
      <td>${food.calories}</td>
    `;
      }

      function updateTotals() {
        let totals = { protein: 0, carbs: 0, fat: 0, calories: 0 };

        foods.forEach((f) => {
          totals.protein += f.protein;
          totals.carbs += f.carbs;
          totals.fat += f.fat;
          totals.calories += f.calories;
        });

        // Table totals
        document.getElementById("totalProtein").textContent = totals.protein;
        document.getElementById("totalCarbs").textContent = totals.carbs;
        document.getElementById("totalFat").textContent = totals.fat;
        document.getElementById("totalCalories").textContent = totals.calories;

        // Today's Macros
        document.getElementById("todayProtein").textContent =
          totals.protein + " g";
        document.getElementById("todayCarbs").textContent = totals.carbs + " g";
        document.getElementById("todayFat").textContent = totals.fat + " g";
        document.getElementById("todayCalories").textContent = totals.calories;
      }

      function clearInputs() {
        document.getElementById("food").value = "";
        document.getElementById("protein").value = "";
        document.getElementById("carbs").value = "";
        document.getElementById("fat").value = "";
        document.getElementById("calories").value = "";
      }

      function clearAll() {
        if (!confirm("Clear all saved data?")) return;
        foods = [];
        saveToLocalStorage();
        document.getElementById("foodTable").innerHTML = "";
        updateTotals();
      }

      // Load stored data on page load
      loadFoods();
    </script>
  </body>
</html>
